services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: popnet
      MYSQL_USER: popnet
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting Compose}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD before starting Compose}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
