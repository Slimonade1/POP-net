services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    # Development mode imports the local realm; it is not suitable for production.
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    healthcheck:
      # Keycloak's management endpoint listens on port 9000 inside the container.
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: popnet
      MYSQL_USER: popnet
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting Compose}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD before starting Compose}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
