services:
  keycloak:
    mem_limit: 520m
    environment:
      JAVA_OPTS_APPEND: "-Xms128m -Xmx300m -XX:MaxMetaspaceSize=180m"
    ports: !override
      - "[::1]:8182:8080"

  mysql:
    mem_limit: 256m
    command: --innodb-buffer-pool-size=64M --performance-schema=OFF
    ports: !override
      - "127.0.0.1:3307:3306"

  app:
    build: .
    mem_limit: 320m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/popnet
      OIDC_ISSUER_URI: http://keycloak:8080/realms/popnet
      SERVER_PORT: 8082
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    ports:
      - "[::1]:8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy