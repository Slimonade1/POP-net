<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>POP-net status board</title>
</head>
<body>

    <a href="/login"><button>Admin login</button></a>

<main>
    <h1>POP-net status board</h1>

    <form method="post" action="/messages">
        <label for="message">New status message</label>
        <input id="message" name="message" type="text" maxlength="200" required>
        <button type="submit">Post message</button>
    </form>

    <p th:if="${error}" th:text="${error}" role="alert"></p>

    <h2>Messages</h2>
    <p th:if="${#lists.isEmpty(messages)}">No messages yet.</p>
    <ul th:unless="${#lists.isEmpty(messages)}">
        <li th:each="message : ${messages}">
            <span th:text="${message.message}"></span>
            <form method="post" action="/messages/delete" style="display: inline">
                <input type="hidden" name="id" th:value="${message.id}">
                <button type="submit">Delete</button>
            </form>
        </li>
    </ul>
</main>
</body>
</html>
