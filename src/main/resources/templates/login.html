<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin login, POP status')}"></head>
<body>
<div class="page">
    <header th:replace="~{fragments/layout :: header}"></header>

    <main>
        <p class="back"><a class="button button--ghost button--small" th:href="@{/}"><svg
                th:replace="~{fragments/icons :: icon('arrow-left')}"></svg>Status page</a></p>
        <h1 class="page-title">Admin login</h1>
        <p class="lede">For the network group. Log in to post announcements on the status page.</p>

        <form class="compose login" method="post" th:action="@{/login}">
            <p class="login__alert status--down" th:if="${param.error}" role="alert">Wrong username or password.</p>
            <p class="login__alert" th:if="${param.logout}" role="status">You are logged out.</p>
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="button button--primary" type="submit">Log in</button>
        </form>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
</body>
</html>
