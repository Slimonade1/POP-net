<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<dl th:fragment="logDetails(log)">
    <dt>Recorded status</dt>
    <dd th:text="${log.status}">down</dd>
    <dt>Recorded at (server time)</dt>
    <dd>
        <span th:text="${log.date != null ? log.date : 'Unknown date'}">2026-11-05</span>
        <span th:text="${log.time != null ? log.time : 'Unknown time'}">10:30</span>
    </dd>
    <dt>Diagnostic message</dt>
    <dd th:text="${#strings.isEmpty(log.message) ? 'No diagnostic message recorded.' : log.message}">HTTP Fault: 503</dd>
    <dt>Check duration</dt>
    <dd th:text="${log.delay_ms != null ? log.delay_ms + ' ms' : 'Not recorded'}">125 ms</dd>
</dl>
</body>
</html>
