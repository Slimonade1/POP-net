<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Announcements, POP status')}"></head>
<body>
<div class="page">
    <header th:replace="~{fragments/layout :: header}"></header>

    <main>
        <h1 class="page-title">Announcements</h1>
        <p class="lede">Announcements show at the top of the status page until you delete them.</p>

        <form class="compose" method="post" th:action="@{/messages}">
            <label for="message">New announcement</label>
            <textarea id="message" name="message" rows="3" maxlength="200" required
                      placeholder="The Wi-Fi in block C is off on Thursday from 22:00 to 23:00."></textarea>
            <p class="compose__error" th:if="${error}" th:text="${error}" role="alert"></p>
            <button class="button button--primary" type="submit">Post announcement</button>
        </form>

        <section aria-labelledby="posted-title">
            <h2 id="posted-title" class="section-title">Posted</h2>
            <p class="empty" th:if="${#lists.isEmpty(messages)}">Nothing posted. The status page shows no announcements.</p>
            <ul class="posted" th:unless="${#lists.isEmpty(messages)}">
                <li th:each="message : ${messages}">
                    <span th:text="${message.message}"></span>
                    <form method="post" th:action="@{/messages/delete}">
                        <input type="hidden" name="id" th:value="${message.id}">
                        <button class="button button--ghost button--small button--danger" type="submit">Delete</button>
                    </form>
                </li>
            </ul>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
</body>
</html>
