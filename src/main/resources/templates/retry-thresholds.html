<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Retry thresholds, POP status')}"></head>
<body>
<div class="page">
    <header th:replace="~{fragments/layout :: adminHeader('thresholds')}"></header>

    <main class="admin">
        <h1 class="admin__title">Retry thresholds</h1>
        <p class="lede">A service is reported as down after this many consecutive failed health checks.</p>
        <p class="alert status--down" th:if="${error}" role="alert" th:text="${error}"></p>

        <ul class="thresholds">
            <li class="threshold" th:each="service : ${services}">
                <span class="threshold__name" th:text="${service.name}">POP Main Website</span>
                <form class="threshold__form" method="post" th:action="@{/admin/services/retry-threshold}">
                    <input type="hidden" name="id" th:value="${service.id}">
                    <label class="visually-hidden" th:for="${'retry-' + service.id}"
                           th:text="${'Retry threshold for ' + service.name}">Retry threshold</label>
                    <div class="stepper">
                        <button class="stepper__button" type="button" data-step="down" aria-label="One fewer"><svg
                                th:replace="~{fragments/icons :: icon('minus')}"></svg></button>
                        <input class="stepper__input" type="number" min="1" required
                               th:id="${'retry-' + service.id}" name="retryThreshold"
                               th:value="${service.retryThreshold}">
                        <button class="stepper__button" type="button" data-step="up" aria-label="One more"><svg
                                th:replace="~{fragments/icons :: icon('plus')}"></svg></button>
                    </div>
                    <button class="button button--primary threshold__save" type="submit">Save</button>
                </form>
            </li>
        </ul>
    </main>
</div>
<script th:src="@{/js/admin.js}" defer></script>
</body>
</html>
