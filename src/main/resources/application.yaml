spring:
  config:
    import: optional:file:./monitoring.yaml
  application:
    name: pop-net
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/popnet}
    username: ${DB_USERNAME:popnet}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:migrations/0000.sql
        - classpath:migrations/0001-monitoring.sql
