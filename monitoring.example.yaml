# Copy to monitoring.yaml in the repository root, then restart the application.
# Relative command paths are resolved from the application's working directory.
monitoring:
  services:
    - id: local-server
      name: Local server
      enabled: true
      command:
        - /bin/bash
        - ./scripts/check-ping.sh
        - 127.0.0.1
      interval: 60s
      timeout: 10s
